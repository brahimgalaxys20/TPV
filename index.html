<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- LA BALISE CRUCIALE POUR LE MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Borne de Commande - Burgers</title>
    <style>
        /* Styles de base adaptés au mobile */
        :root {
            --primary: #ff9f43;
            --primary-dark: #ee5253;
            --bg: #f8f9fa;
            --text: #2d3436;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Enlève le flash bleu au clic sur mobile */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        /* Conteneur fluide : prend 100% de la largeur du téléphone sans jamais dépasser 450px */
        .borne-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-top: 0;
            color: var(--text);
        }

        /* Grille des produits */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        /* Cartes de burgers optimisées pour le pouce */
        .burger-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f2f6;
            padding: 14px;
            border-radius: 16px;
        }

        .burger-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .burger-emoji {
            font-size: 2.2rem;
        }

        .burger-details h3 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
        }

        .burger-details p {
            margin: 0;
            color: #57606f;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Gros boutons faciles à cliquer sur écran tactile */
        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 159, 67, 0.3);
            transition: transform 0.1s;
        }

        .btn-add:active {
            transform: scale(0.9);
            background: var(--primary-dark);
        }

        /* Panier et validation */
        .panier-section {
            background: #2d3436;
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
        }

        .total-text {
            font-size: 1.1rem;
            margin: 0 0 12px 0;
        }

        .btn-valider {
            width: 100%;
            background: #10ac84;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 172, 132, 0.3);
        }

        .btn-valider:active {
            background: #0ea07a;
        }
    </style>
</head>
<body>

    <div class="borne-container">
        <h1>Borne de Commande 🍔</h1>
        
        <div class="menu">
            <!-- Produit 1 -->
            <div class="burger-item">
                <div class="burger-info">
                    <span class="burger-emoji">🍔</span>
                    <div class="burger-details">
                        <h3>Hamburger</h3>
                        <p>2,00 €</p>
                    </div>
                </div>
                <button class="btn-add" onclick="ajouterAuPanier('Hamburger', 2)">+</button>
            </div>

            <!-- Produit 2 -->
            <div class="burger-item">
                <div class="burger-info">
                    <span class="burger-emoji">🧀</span>
                    <div class="burger-details">
                        <h3>Cheese burger</h3>
                        <p>3,00 €</p>
                    </div>
                </div>
                <button class="btn-add" onclick="ajouterAuPanier('Cheese burger', 3)">+</button>
            </div>

            <!-- Produit 3 -->
            <div class="burger-item">
                <div class="burger-info">
                    <span class="burger-emoji">👑</span>
                    <div class="burger-details">
                        <h3>Double Cheese</h3>
                        <p>5,00 €</p>
                    </div>
                </div>
                <button class="btn-add" onclick="ajouterAuPanier('Double Cheese', 5)">+</button>
            </div>
        </div>

        <!-- Section Panier -->
        <div class="panier-section">
            <p class="total-text">Mon Panier : <span id="count">0</span> burger(s) | <span id="total">0,00</span> €</p>
            <button class="btn-valider" onclick="validerCommande()">Valider la commande 🛒</button>
        </div>
    </div>

    <script>
        let totalPrix = 0;
        let totalArticles = 0;

        function ajouterAuPanier(nom, prix) {
            totalPrix += prix;
            totalArticles += 1;
            document.getElementById('count').innerText = totalArticles;
            document.getElementById('total').innerText = totalPrix.toFixed(2);
        }

        function validerCommande() {
            if(totalArticles === 0) {
                alert("Votre panier est vide !");
            } else {
                alert(`Commande validée !\nTotal : ${totalPrix.toFixed(2)} €\nMerci de votre visite ! 🚀`);
                // Réinitialisation
                totalPrix = 0;
                totalArticles = 0;
                document.getElementById('count').innerText = "0";
                document.getElementById('total').innerText = "0,00";
            }
        }
    </script>
</body>
</html>
